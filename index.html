<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/src/style/global.css" />
  <!-- <link rel="stylesheet" href="/src/style/header.css" /> -->

  <link rel="stylesheet" href="/src/style/homePage.css" />

  <link rel="stylesheet" href="/src/style/input.css" />
  <title>Sociable | Homepage</title>
</head>

<body>
  <nav class="bg-red-400 border-b border-gray-300 flex flex-col min-h-10 justify-center">
    <div class=" block md:hidden " id="hamburger">
      <img src="./src/assets/hamburger-menu.svg" class="svg-icon h-8 ml-1 " />
    </div>
    <ul id="nav-links" class=" hidden flex flex-col justify-around z-10 gap-1 md:flex md:flex-row md:items-center">
      <li><a href="/js2-camilla-furuknappen-larsen/">Home </a></li>
      <li><a id="profile-page-link" href="">Profile Page</a></li>
      <li><button id="log-out-btn" class="">Log out</button></li>
    </ul>
    <div id="following-container-mobile" class="pt-4 flex flex-col hidden md:hidden">
      <h3>You're Following</h3>

      <div id="following-container" class="following hidden"></div>
    </div>
  </nav>

  <aside id="following-aside">
    <!-- <input type="text" id="search-following"> -->
    <div id="following-container" class="following">
      <!-- Where the users you follow are -->
    </div>
  </aside>

  <main id="homepage-main" class="pt-4">
    <div id="search-add-div" class="flex flex-col h-25 md:flex-row md:items-center md:justify-center md:h-16">
      <a id="create-post-btn" class="border-none bg-fuchsia-600 px-4 py-2 mx-8 my-4 rounded-md text-white text-center"
        href="/js2-camilla-furuknappen-larsen/src/pages/createPostPage/createpost.html">Create new post</a>
      <input type="text" id="post-search-field" placeholder="Search for post"
        class="mx-4 flex rounded border md:max-w-200 " />
      <div id="search-error-div"></div>
    </div>

    <section id="posts-parent" class="post"></section>
    <div class="btn-div">
      <button id="prev-btn">Previous Page</button>
      <button id="next-btn">Next Page</button>
    </div>
  </main>
  <script type="module" src="./src/pages/homePage/homePage.ts"></script>
  <script type="module" src="./src/components/asideFollowing.ts"></script>
  <script type="module" src="./src/components/pagination.ts"></script>
</body>

</html>
