  <body>
    <h1>Register</h1>
    <p
      id="error-request"
      class="alert-info"
      role="alert"
      aria-live="polite"
    ></p>
    <form id="registration-form">
      <div class="form-group">
        <label for="username"> Username </label><br />
        <input
          type="text"
          id="username"
          name="username"
          required
          placeholder="Enter name"
          autocomplete="username"
        /><br />
        <p
          id="username-error"
          class="alert-info"
          role="alert"
          aria-live="polite"
        >
          Username is required
        </p>
      </div>

      <div class="form-group">
        <label for="registration-email"> Email Address</label><br />
        <input
          type="email"
          id="registration-email"
          name="email"
          placeholder="email@stud.noroff.no"
          aria-describedby="email-error"
          required
        />
        <p id="email-error" class="alert-info" role="alert" aria-live="polite">
          Email must be a Noroff student mail
        </p>
      </div>

      <div class="form-group">
        <label for="password1"> Password</label><br />
        <input
          type="password"
          id="password1"
          name="password1"
          required
          placeholder="Enter password"
          aria-describedby="password-error"
        /><br />
        <p
          id="password-error"
          class="alert-info"
          role="alert"
          aria-live="polite"
        >
          Passwords must be at least 8 characters long
        </p>
      </div>

      <div class="form-group">
        <label for="password2"> Repeat Password</label><br />
        <input
          type="password"
          id="password2"
          name="password2"
          required
          placeholder="Repeat password"
          aria-describedby="password-confirm-error"
        /><br />
        <p
          id="password-confirm-error"
          class="alert-info"
          role="alert"
          aria-live="polite"
        >
          Passwords must match
        </p>
      </div>

      <div class="bottomButtons">
        <div class="backToBtnDivCheckout">
          <h2 class="account-link">Already got an account?</h2>
          <a class="linkBackBtn" href="login.html">
            <!-- <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"

                <path d="M5 12l6 6" />
                <path d="M5 12l6 -6" />
              </svg> -->
            <span> Sign in here </span>
          </a>
        </div>
        <button type="submit" class="btn checkoutBtn" id="registerBtn">
          Continue
        </button>
      </div>
    </form>
    <p id="error-message"></p>

    <script type="module" src="./src/main.ts"></script>
  </body>
