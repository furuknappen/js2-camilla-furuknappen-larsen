  <nav class="border-line-light dark:border-line-dark flex min-h-12 flex-col justify-center border-b">

        <img id="sun-icon" src="./src/assets/sun.svg" />
        <img id="moon-icon" src="./src/assets/moon.svg" class="hidden" />

    <div class="flex justify-between h-12 lg:hidden " >
      <div id="hamburger" class="flex items-center">

        <img id="sun-icon" src="./src/assets/sun.svg" />
        <img id="moon-icon" src="./src/assets/moon.svg" class="hidden" />
      </button> -->

    <ul id="nav-links" class="hidden flex-col justify-around gap-1 lg:flex lg:flex-row lg:items-center">
      <li class="active:text-primary ml-4 pt-4 lg:pt-0">
        <a href="/js2-camilla-furuknappen-larsen/" class="hover:text-primary-hover">Home</a>
      </li>
      <li class="active:text-primary ml-4 pt-4 lg:pt-0">

        <button id="log-out-btn" class="hover:text-primary-hover">
          Log out
        </button>
      </li>
    </ul>
    <div id="following-container-mobile"
      class="border-line-light dark:border-line-dark relative hidden w-full flex-col rounded-lg border-b bg-background-lightdark:bg-background-dark pt-4 lg:fixed lg:top-40 lg:right-4 lg:flex lg:w-60 lg:border lg:p-4 xl:w-80">

  <aside id="following-aside">
    <!-- <input type="text" id="search-following"> -->
    <div id="following-container">

    </div>

  <main id="homepage-main" class="pt-4">

      <a id="create-post-btn"

        <div id="search-error-div"></div>

    <div class="my-12 flex justify-center gap-4 md:gap-20 md:text-xl">
      <button id="prev-btn"
        class="bg-primary text-light-text hover:bg-primary-hover mx-8 my-4 rounded-md px-5 py-1 text-center active:translate-y-1 md:px-4 md:py-3">
        Previous Page
      </button>
      <button id="next-btn"
        class="bg-primary text-light-text hover:bg-primary-hover mx-8 my-4 rounded-md px-5 py-1 text-center active:translate-y-1 md:px-4 md:py-3">
