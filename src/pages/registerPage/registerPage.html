<!doctype html>
<html lang="en-US">

<head>
  <meta charset="UTF-8" />
  <meta name="author" content="Camilla Furuknappen Larsen" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Connect with friends and chare experiences">
  <link rel="stylesheet" href="../../style/form-style.css" />
  <link rel="stylesheet" href="../../style/global.css" />
  <link rel="stylesheet" href="../../style/register.css" />

  <title>Sociable | Sign up</title>
</head>
<a href="/js2-camilla-furuknappen-larsen/src/pages/loginPage/login.html" rel="noopener noreferrer">login</a>

<body>
  <main id="login-main">
    <h1>Register</h1>
    <p id="error-request" class="alert-info" role="alert" aria-live="polite"></p>
    <form id="registration-form">
      <div class="form-group">
        <label for="username"> Username </label><br />
        <input type="text" id="username" name="username" required placeholder="Enter name"
          autocomplete="username" /><br />
        <p id="username-error" class="alert-info" role="alert" aria-live="polite">
          Username is required
        </p>
      </div>
      <div>
        <label for="registration-image">Optional Profile Picture </label>
      </br>

        <input type="url" id="registration-image" name="imageUrl" placeholder="www.example.com/image" />
      </div>
      <div>
        <label for="registration-image-alt">Describe the picture to help others see</label></br>

        <input type="text" id="registration-image-alt" name="imageAlt" placeholder="A yellow and orange sunset" />
      </div>
      <div class="form-group">
        <label for="registration-email"> Email Address</label><br />
        <input type="email" id="registration-email" name="email" placeholder="email@stud.noroff.no"
          aria-describedby="email-error" required />
        <p id="email-error" class="alert-info" role="alert" aria-live="polite">
          Email must be a Noroff student mail
        </p>
      </div>

      <div class="form-group">
        <label for="password1"> Password</label><br />
        <input type="password" id="password1" name="password1" required placeholder="Enter password"
          aria-describedby="password-error" /><br />
        <p id="password-error" class="alert-info" role="alert" aria-live="polite">
          Passwords must be at least 8 characters long
        </p>
      </div>

      <div class="form-group">
        <label for="password2"> Repeat Password</label><br />
        <input type="password" id="password2" name="password2" required placeholder="Repeat password"
          aria-describedby="password-confirm-error" /><br />
        <p id="password-confirm-error" class="alert-info" role="alert" aria-live="polite">
          Passwords must match
        </p>
      </div>

      <div class="bottomButtons">
        <div class="backToBtnDivCheckout">
          <h2 class="account-link">Already got an account?</h2>
          <a class="linkBackBtn" href="/js2-camilla-furuknappen-larsen/src/pages/loginPage/login.html">
            <!-- <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-left">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M5 12l14 0" />
                <path d="M5 12l6 6" />
                <path d="M5 12l6 -6" />
              </svg> -->
            <span> Sign in here </span>
          </a>
        </div>
        <button type="submit" class="btn checkoutBtn" id="registerBtn">
          Continue
        </button>
      </div>
    </form>
    <p id="error-message"></p>
  </main>
  <script type="module" src="./registerForm.ts"></script>
</body>

</html>
