<!doctype html>
<html lang="en-US">

<head>
  <meta charset="UTF-8" />
  <meta name="author" content="Camilla Furuknappen Larsen" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Connect with friends and chare experiences" />

  <link rel="stylesheet" href="../../style/global.css" />

  <link rel="stylesheet" href="../../style/input.css" />
  <title>Sociable | Sign up</title>
</head>

<body>
  <nav class="border-line-light dark:border-line-dark flex min-h-12 flex-col justify-center border-b">
    <button id="theme-btn" class="items-center mr-4 absolute right-2 lg:right-8">
      <img id="sun-icon" src="../../assets/sun.svg" />
      <img id="moon-icon" src="../../assets/moon.svg" class="hidden" />
    </button>
    <div class="flex justify-between h-12 items-center lg:hidden ">
      <div id="hamburger">
        <img src="../../assets/hamburger-menu.svg" class="ml-1 h-8" />
      </div>

    </div>


    <ul id="nav-links" class="hidden flex-col justify-start gap-1 lg:flex lg:flex-row lg:items-center">
      <li class="active:text-primary ml-4 pt-4 lg:pt-0">
        <a href="/js2-camilla-furuknappen-larsen/src/pages/loginPage/login.html" class="hover:text-primary-hover"> Go to
          Login Page </a>
      </li>
    </ul>
  </nav>
  <main id="login-main" class="mx-auto flex max-w-96 flex-col py-24">
    <h1 class="text-4xl">Register</h1>
    <p id="error-request" class="text-secondary-text block pl-4" role="alert" aria-live="polite"></p>
    <form id="registration-form">
      <div class="flex flex-col gap-4">
        <label class="ml-2 pt-8 font-semibold" for="username">
          Username
        </label>
        <input class="input-field" type="text" id="username" name="username" required placeholder="Enter name"
          autocomplete="username" />
        <p id="username-error" class="text-secondary-text block pl-4" role="alert" aria-live="polite">
          Username is required
        </p>
      </div>
      <div class="flex flex-col gap-4">
        <label class="ml-2 pt-8 font-semibold" for="registration-image">Optional Profile Picture
        </label>

        <input class="input-field" type="url" id="registration-image" name="imageUrl"
          placeholder="www.example.com/image" />
      </div>
      <div class="flex flex-col gap-4">
        <label class="ml-2 pt-8 font-semibold" for="registration-image-alt">Describe the picture to help others
          see</label>

        <input class="input-field" type="text" id="registration-image-alt" name="imageAlt"
          placeholder="A yellow and orange sunset" />
      </div>
      <div class="flex flex-col gap-4">
        <label class="ml-2 pt-8 font-semibold" for="registration-email">
          Email Address</label>
        <input class="input-field" type="email" id="registration-email" name="email" placeholder="email@stud.noroff.no"
          aria-describedby="email-error" required />
        <p id="email-error" class="text-secondary-text block pl-4" role="alert" aria-live="polite">
          Email must be a Noroff student mail
        </p>
      </div>

      <div class="flex flex-col gap-4">
        <label class="ml-2 pt-8 font-semibold" for="password1">
          Password</label>
        <input class="input-field" type="password" id="password1" name="password1" required placeholder="Enter password"
          aria-describedby="password-error" />
        <p id="password-error" class="text-secondary-text block pl-4" role="alert" aria-live="polite">
          Passwords must be at least 8 characters long
        </p>
      </div>

      <div class="flex flex-col gap-4">
        <label class="ml-2 pt-8 font-semibold" for="password2">
          Repeat Password</label>
        <input class="input-field" type="password" id="password2" name="password2" required
          placeholder="Repeat password" aria-describedby="password-confirm-error" />
        <p id="password-confirm-error" class="text-secondary-text block pl-4" role="alert" aria-live="polite">
          Passwords must match
        </p>
      </div>

      <div class="my-8 flex items-center justify-center">
        <div>
          <h2>Already got an account?</h2>
          <a class="underline underline-offset-3" href="/js2-camilla-furuknappen-larsen/src/pages/loginPage/login.html"
            rel="noopener noreferrer">
            <span> Sign in here </span>
          </a>
        </div>
        <button type="submit" class="bg-primary text-light-text ml-8 rounded-xl px-4 py-2 md:px-8 md:text-xl"
          id="registerBtn">
          Continue
        </button>
      </div>
    </form>
  </main>
  <script type="module" src="./registerForm.ts"></script>
  <script type="module" src="../../components/header.ts"></script>
</body>

</html>
