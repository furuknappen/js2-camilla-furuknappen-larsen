<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="../../style/global.css" />
  <link rel="stylesheet" href="../../style/input.css" />

  <title>Sociable | New Post</title>
</head>

<body>
  <nav class="border-line-light dark:border-line-dark flex min-h-12 flex-col justify-center border-b">
    <button id="theme-btn" class="items-center mr-4 absolute right-2 lg:right-8">
      <img id="sun-icon" src="../../assets/sun.svg" />
      <img id="moon-icon" src="../../assets/moon.svg" class="hidden" />
    </button>
    <div class="flex justify-between h-12 items-center lg:hidden ">
      <div id="hamburger">
        <img src="../../assets/hamburger-menu.svg" class="ml-1 h-8" />
      </div>
    </div>
    <ul id="nav-links" class="hidden flex-col justify-around gap-1 lg:flex lg:flex-row lg:items-center">
      <li class="active:text-primary ml-4 pt-2 lg:pt-0">
        <a href="/js2-camilla-furuknappen-larsen/" class="hover:text-primary-hover">Home</a>
      </li>
      <li class="active:text-primary ml-4 pt-2 lg:pt-0">
        <a id="profile-page-link" href="" class="hover:text-primary-hover">Profile Page</a>
      </li>
      <li class="active:text-primary ml-4 pt-2 lg:pt-0">
        <button id="log-out-btn" class="hover:text-primary-hover">
          Log out
        </button>
      </li>
    </ul>
    <div id="following-container-mobile"
      class="border-line-light dark:border-line-dark relative hidden w-full flex-col rounded-lg border-b bg-background-light dark:bg-background-dark pt-4 lg:fixed lg:top-40 lg:right-4 lg:flex lg:w-60 lg:border lg:p-4 xl:w-80">
      <h3 class="px-2 text-base font-semibold">You're Following</h3>

      <div id="following-container"></div>
    </div>
  </nav>

  <main id="create-post-main" class="mx-auto flex max-w-96 flex-col py-24">
    <h1 class="ml-4 text-4xl">Create a new Post</h1>
    <form id="create-new-post-form" class="flex w-full flex-col px-4 pt-8">
      <label class="ml-2 pt-8 font-semibold" for="title-input"> Title</label>
      <input class="input-field" id="title-input" type="text" placeholder="Title" />
      <label class="ml-2 pt-8 font-semibold" for="body-input">Text</label>
      <textarea class="input-field h-20" id="body-input" placeholder="Write what you want to publish"
        maxlength="280"></textarea>
      <label class="ml-2 pt-8 font-semibold" for="tag-input">Tags</label>
      <input class="input-field" id="tag-input" placeholder="#monday" maxlength="24" />
      <label class="ml-2 pt-8 font-semibold" for="img-input">Image</label>
      <input class="input-field" id="img-input" type="url" placeholder="www.example.com/image" />
      <label class="ml-2 pt-8 font-semibold" for="alt-text-input">Description of the photo</label>
      <input class="input-field" id="alt-text-input" type="text" placeholder="A yellow flower" />

      <p id="new-post-error-div" class="py-4 font-semibold text-red-400"></p>

      <div id="button-div" class="mt-8 flex flex-row items-center justify-center gap-16">
        <a href="/js2-camilla-furuknappen-larsen/" id="cancel-create-btn">Cancel</a>
        <button type="submit" id="new-post-submit-btn"
          class="bg-primary text-light-text ml-8 rounded-xl px-4 py-2 text-lg md:px-8 md:text-xl">
          Publish
        </button>
      </div>
    </form>
  </main>
  <script type="module" src="createPost.ts"></script>
  <script type="module" src="../../components/header.ts"></script>
</body>

</html>
