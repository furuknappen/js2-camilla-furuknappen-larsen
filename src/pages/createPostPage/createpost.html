<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../../style/global.css" />
    <link rel="stylesheet" href="./createpost.css" />
    <title>Sociable | New Post</title>
  </head>

  <body>
    <main id="create-post-main">
      <h1>Create a new Post</h1>
      <form id="create-new-post-form">
        <label for="title-input"> Title</label><br />
        <input id="title-input" type="text" placeholder="Title" />
        <label for="body-input"> Text</label><br />
        <textarea id="body-input" placeholder="Write what you want to publish">
        </textarea>
        <label for="tag-input"> Tags</label><br />
        <input id="tag-input" placeholder="tags" />
        <label for="img-input"> Image</label><br />
        <input id="img-input" type="url" placeholder="www.example.com/image" />
        <label for="alt-text-input"> Description of the photo</label><br />
        <input id="alt-text-input" type="text" placeholder="A yellow flower" />

        <div id="button-div">
          <a href="/js2-camilla-furuknappen-larsen/" id="cancel-create-btn"
            >Cancel</a
          >
          <button type="submit" id="new-post-submit-btn">Publish</button>
        </div>
      </form>
    </main>

    <script type="module" src="createPost.ts"></script>
  </body>
</html>
