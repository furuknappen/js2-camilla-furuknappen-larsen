<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../../style/global.css" />
  <link rel="stylesheet" href="./createpost.css" />

</head>

<body>
  <main id="create-post-main">
    <h1>Create a new Post</h1>
    <form id="create-new-post-form">
      <input id="title-input" type="text" placeholder="Title">
      <textarea id="body-input" placeholder="Write what you want to publish"> </textarea>
      <input id="tag-input" placeholder="tags">
      <input id="img-input" type="url" placeholder="www.example.com/image">
      <input id="alt-text-input" type="text" placeholder="describe your photo">

      <div id="button-div">
        <a href="../../../index.html" id="cancel-create-btn">Cancel</a>
        <button type="submit" id="new-post-submit-btn">Publish</button>
      </div>

    </form>
  </main>

  <script type="module" src="createPost.ts"></script>
</body>

</html>
