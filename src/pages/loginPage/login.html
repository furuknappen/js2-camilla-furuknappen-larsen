<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../../style/global.css" />

    <link rel="stylesheet" href="../../style/input.css" />
    <title>Sociable | Login</title>
  </head>

  <body>
    <nav class="border-line-light dark:border-line-dark flex min-h-12 flex-col justify-center border-b">
    <button id="theme-btn" class="items-center mr-4 absolute right-2 lg:right-8">
        <img id="sun-icon" src="../../assets/sun.svg" />
        <img id="moon-icon" src="../../assets/moon.svg" class="hidden" />
      </button>
    <div class="flex justify-between h-12 items-center lg:hidden " >
      <div id="hamburger">
      <img src="../../assets/hamburger-menu.svg" class="ml-1 h-8" /></div>
    </div>

    <ul id="nav-links" class="hidden flex-col justify-start gap-1 lg:flex lg:flex-row lg:items-center" >
      <li class="active:text-primary ml-4 pt-4 lg:pt-0">
        <a href="/js2-camilla-furuknappen-larsen/src/pages/registerPage/registerPage.html" class="hover:text-primary-hover">  Go to Register Page </a>
      </li>
    </ul>
    </nav>
    <main id="login-main" class="mx-auto flex max-w-96 flex-col pt-48">
      <h1 class="text-4xl">Sign in</h1>
      <p
        id="error-request"
        class="text-secondary-text block py-4"
        role="alert"
        aria-live="polite"
      ></p>
      <form id="sign-in-form">
        <div class="flex flex-col gap-4">
          <label for="login-email" class="ml-2 pt-4 font-semibold">
            Email Address</label
          >
          <input
            class="input-field"
            type="email"
            id="login-email"
            name="email"
            placeholder="email@stud.noroff.no"
            aria-describedby="error-request"
            required
          />
        </div>

        <div class="flex flex-col gap-4">
          <label for="login-password" class="ml-2 pt-8 font-semibold">
            Password</label
          >
          <input
            class="input-field"
            id="login-password"
            name="password"
            required
            placeholder="Enter password"
            type="password"
            aria-describedby="error-request"
          />
        </div>

        <div class="my-8 flex items-center justify-center">
          <div>
            <h2>Dont have an account yet?</h2>
            <a
              class="underline underline-offset-3"
              href="../registerPage/registerPage.html"
            >
              <span> Sign up here </span>
            </a>
          </div>
          <button
            type="submit"
            class="bg-primary text-light-text ml-8 rounded-xl px-4 py-2 md:px-8 md:text-xl"
            id="loginBtn"
          >
            Sign in
          </button>
        </div>
      </form>
    </main>
    <script type="module" src="./loginForm.ts"></script>
      <script type="module" src="../../components/header.ts"></script>
  </body>
</html>
