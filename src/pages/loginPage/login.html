<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../../style/form-style.css" />
    <link rel="stylesheet" href="../../style/global.css" />
    <link rel="stylesheet" href="../../style/register.css" />
     <link rel="stylesheet" href="../../style/input.css" />
    <title>Sociable | Login</title>
  </head>

  <body>
    <main id="login-main" class="pt-48 flex flex-col mx-auto max-w-96 " >
      <!-- <a href="../registerPage/registerPage.html" rel="noopener noreferrer">Register</a> -->
      <h1 class="text-4xl">Sign in</h1>
      <p
        id="error-request"
        class="alert-info"
        role="alert"
        aria-live="polite"
      ></p>
      <form id="sign-in-form" class="">
        <div class="form-group flex flex-col gap-4 ">
          <label for="login-email" class="pt-4 ml-2   font-semibold"> Email Address</label>
          <input
            class="input-field "
            type="email"
            id="login-email"
            name="email"
            placeholder="email@stud.noroff.no"
            aria-describedby="error-request"
            required
          />
        </div>

        <div class="form-group flex flex-col gap-4">
          <label for="login-password" class="pt-8 ml-2 font-semibold"> Password</label>
          <input
            class="input-field "
            id="login-password"
            name="password"
            required
            placeholder="Enter password"
            type="password"
            aria-describedby="error-request"
          />
        </div>

        <div class="bottomButtons flex my-8 items-center justify-center ">
          <div class="backToBtnDivCheckout">
            <h2 class="account-link ">Dont have an account yet?</h2>
            <a class="linkBackBtn underline underline-offset-3 " href="../registerPage/registerPage.html">
              <!-- <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-left">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M5 12l14 0" />
                <path d="M5 12l6 6" />
                <path d="M5 12l6 -6" />
              </svg> -->
              <span> Sign up here </span>
            </a>
          </div>
          <button type="submit" class="btn checkoutBtn px-4 md:text-xl bg-fuchsia-600 text-white rounded-xl md:px-8 py-2 ml-8" id="loginBtn">
            Sign in
          </button>
        </div>
      </form>
    </main>
    <script type="module" src="./loginForm.ts"></script>
  </body>
</html>
